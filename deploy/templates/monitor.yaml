{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.app }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.app }}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
{{- end }}
{{- if .Values.monitoring.alerts }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Values.app }}-alerts
spec:
  groups:
    - name: {{ .Values.app }}.availability
      rules:
        - alert: ApplicationUnavailable
          expr: sum(kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}"}) < sum(kube_deployment_spec_replicas{namespace="{{ .Release.Namespace }}"})
          for: {{ .Values.monitoring.alerts.unavailableMinutes | default 5 }}m
          labels: {severity: warning, application: {{ .Values.app }}}
          annotations: {summary: {{ printf "%s has unavailable replicas" .Values.app | quote }}}
        - alert: ApplicationRestarting
          expr: sum(increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}"}[15m])) > {{ .Values.monitoring.alerts.restarts | default 3 }}
          for: 2m
          labels: {severity: warning, application: {{ .Values.app }}}
          annotations: {summary: {{ printf "%s is restarting" .Values.app | quote }}}
{{- end }}
