{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.app }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: {{ .Values.gateway.namespace }}
      {{- with .Values.gateway.sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
  hostnames: [{{ .Values.host | quote }}]
  rules:
    {{- range .Values.routes }}
    {{- if not (hasKey $.Values.workloads .workload) }}
    {{- fail (printf "Route refers to missing workload %s" .workload) }}
    {{- end }}
    - matches:
        - path: {type: PathPrefix, value: {{ .path | quote }}}
      backendRefs:
        - {name: {{ $.Values.app }}-{{ .workload }}, group: '', kind: Service, port: 80, weight: 1}
      {{- with .timeouts }}
      timeouts: {{ toJson . }}
      {{- end }}
    {{- end }}
{{- end }}
